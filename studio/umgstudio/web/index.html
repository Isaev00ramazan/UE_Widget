<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMG Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">UMG <b>Studio</b></div>
  <div class="crumbs"><span id="srcTitle">—</span><nav id="wbpTabs" class="tabs" aria-label="Виджеты источника"></nav></div>
  <div class="actions">
    <button id="bCopy" class="primary" title="Текст вставки в буфер обмена — в Designer: пустая Hierarchy → Ctrl+V">Скопировать для UE</button>
    <button id="bBuild" title="Записать *.paste.txt спецификации (как py экран.py)">Записать paste.txt</button>
  </div>
</header>

<div class="main">
  <aside class="side">
    <div class="side-head">Экраны</div>
    <div id="sources" class="sources"></div>
  </aside>

  <section class="view">
    <div class="toolbar">
      <label>Размер
        <select id="selSize">
          <option value="auto">Авто (Canvas — экран, иначе желаемый)</option>
          <option value="screen">Экран 1920×1080</option>
          <option value="desired">Желаемый размер</option>
          <option value="custom">Свой…</option>
        </select>
      </label>
      <span id="customSize" hidden><input id="inW" type="number" value="1920" min="1"> × <input id="inH" type="number" value="1080" min="1"></span>
      <label>Фон
        <select id="selBg">
          <option value="scene">Сцена</option>
          <option value="dark">Тёмный</option>
          <option value="checker">Шахматка</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="cSafe"> Рамка 48</label>
      <label class="chk"><input type="checkbox" id="cOutline"> Контуры</label>
      <label class="chk"><input type="checkbox" id="cVars"> ✎ подсветка</label>
      <span class="sep"></span>
      <label title="Компонент дизайн-системы Claude Design для сверки">Макет
        <select id="selDesign"><option value="">—</option></select>
      </label>
      <select id="selDMode" title="Как показать макет">
        <option value="over">Поверх</option>
        <option value="diff">Разница</option>
        <option value="only">Только макет</option>
        <option value="side">Рядом</option>
      </select>
      <input id="rngDOp" type="range" min="0" max="100" value="50" title="Прозрачность макета" aria-label="Прозрачность макета">
      <label>Масштаб
        <select id="selZoom">
          <option value="fit">Вписать</option>
          <option value="1">100%</option>
          <option value="0.5">50%</option>
          <option value="2">200%</option>
        </select>
      </label>
      <span id="dims" class="dims"></span>
    </div>
    <div id="viewport" class="viewport bg-scene">
      <div id="stageWrap" class="stage-wrap"><div id="stage" class="stage"></div><iframe id="designOver" class="design-over" title="Макет поверх превью" hidden></iframe></div>
      <pre id="error" class="error" hidden></pre>
    </div>
    <div id="designPane" class="design-pane" hidden>
      <iframe id="designSide" title="Макет из Claude Design"></iframe>
      <div id="designReadme" class="design-readme"></div>
    </div>
    <div id="states" class="states" hidden></div>
    <div id="warnings" class="warnings" hidden></div>
  </section>

  <aside class="panel">
    <div class="panel-tabs"><span>Hierarchy</span><button id="bShowAll" class="mini" title="Показать все Collapsed-элементы (проверка состояний)">Показать скрытые</button><button id="bReset" class="mini" title="Сбросить переключения видимости">Сброс</button></div>
    <div id="tree" class="tree" role="tree"></div>
    <div class="panel-tabs"><span>Свойства</span></div>
    <div id="props" class="props"><p class="hint">Выбери элемент в дереве или на экране.</p></div>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
