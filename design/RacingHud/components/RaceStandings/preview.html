<script>
  (function () {
    document.querySelectorAll('.radar svg').forEach(function (svg) {
      var trk = svg.querySelector('#trk'), len = trk.getTotalLength();
      svg.querySelectorAll('[data-at]').forEach(function (el) {
        var p = trk.getPointAtLength(len * parseFloat(el.getAttribute('data-at')));
        el.setAttribute('cx', p.x); el.setAttribute('cy', p.y);
      });
      svg.querySelectorAll('[data-tag]').forEach(function (el) {
        var p = trk.getPointAtLength(len * parseFloat(el.getAttribute('data-tag')));
        el.setAttribute('x', p.x); el.setAttribute('y', p.y);
      });
      var g = svg.querySelector('.rd-ticks'), ns = 'http://www.w3.org/2000/svg';
      for (var a = 0; a < 360; a += 15) {
        var r1 = a % 45 === 0 ? 144 : 150, rad = a * Math.PI / 180, l = document.createElementNS(ns, 'line');
        l.setAttribute('class', 'rd-tick');
        l.setAttribute('x1', 160 + r1 * Math.sin(rad)); l.setAttribute('y1', 160 - r1 * Math.cos(rad));
        l.setAttribute('x2', 160 + 157 * Math.sin(rad)); l.setAttribute('y2', 160 - 157 * Math.cos(rad));
        g.appendChild(l);
      }
    });
  })();
</script>
