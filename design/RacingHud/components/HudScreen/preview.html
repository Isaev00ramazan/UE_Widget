<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: var(--surface); }
  .ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: var(--surface); font: 500 13px/1 system-ui, sans-serif; color: var(--ink-muted); }
  .ctrl b { font-weight: 600; color: var(--ink); margin-right: 4px; }
  .ctrl .sep { width: 1px; height: 20px; background: var(--edge); margin: 0 8px; }
  .ctrl button {
    font: 500 13px/1 system-ui, sans-serif; color: var(--ink); background: var(--glass-strong);
    border: 1px solid var(--edge); border-radius: var(--radius-key); padding: 7px 12px; cursor: pointer;
  }
  .ctrl button[aria-pressed="true"] { background: var(--race); color: var(--on-accent); border-color: transparent; }
  .ctrl button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #wrap { position: relative; width: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  .abs { position: absolute; }
  #lens, #hud { position: absolute; inset: 0; }
  #hud { --s: 0.35; }
  .ctrl input[type=range] { width: 140px; accent-color: var(--race); }
  .ctrl output { min-width: 34px; color: var(--ink); font-variant-numeric: tabular-nums; }
  #lens.fisheye { filter: url(#fisheye); }

  /* 3D-наклон: кластеры повёрнуты к центру экрана, как на изогнутом стекле */
  .cl { transition: transform 240ms ease-out; }
  #hud.tilt .cl-tr { transform: perspective(1400px) rotateY(calc(-16deg * var(--s))) rotateX(calc(-6deg * var(--s))); transform-origin: 100% 0; }
  #hud.tilt .cl-br { transform: perspective(1400px) rotateY(calc(-16deg * var(--s))) rotateX(calc(6deg * var(--s))); transform-origin: 100% 100%; }
  #hud.tilt .cl-bl { transform: perspective(1400px) rotateY(calc(16deg * var(--s))) rotateX(calc(6deg * var(--s))); transform-origin: 0 100%; }

  /* Крен в поворотах: HUD отстаёт от лодки и слегка заваливается */
  #hud.sway { animation: hud-sway 4.2s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes hud-sway {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(calc(-18px * var(--s))) rotate(calc(-1.1deg * var(--s))); }
    50% { transform: translateX(0) rotate(0deg); }
    75% { transform: translateX(calc(18px * var(--s))) rotate(calc(1.1deg * var(--s))); }
  }
  @media (prefers-reduced-motion: reduce) { #hud.sway { animation-duration: 12s; } }
</style>
</head>

<script>
  (function () {
    document.querySelectorAll('.radar svg').forEach(function (svg) {
      var trk = svg.querySelector('#trk'), len = trk.getTotalLength();
      svg.querySelectorAll('[data-at]').forEach(function (el) {
        var p = trk.getPointAtLength(len * parseFloat(el.getAttribute('data-at')));
        el.setAttribute('cx', p.x); el.setAttribute('cy', p.y);
      });
      svg.querySelectorAll('[data-tag]').forEach(function (el) {
        var p = trk.getPointAtLength(len * parseFloat(el.getAttribute('data-tag')));
        el.setAttribute('x', p.x); el.setAttribute('y', p.y);
      });
      var g = svg.querySelector('.rd-ticks'), ns = 'http://www.w3.org/2000/svg';
      for (var a = 0; a < 360; a += 15) {
        var r1 = a % 45 === 0 ? 144 : 150, rad = a * Math.PI / 180, l = document.createElementNS(ns, 'line');
        l.setAttribute('class', 'rd-tick');
        l.setAttribute('x1', 160 + r1 * Math.sin(rad)); l.setAttribute('y1', 160 - r1 * Math.cos(rad));
        l.setAttribute('x2', 160 + 157 * Math.sin(rad)); l.setAttribute('y2', 160 - 157 * Math.cos(rad));
        g.appendChild(l);
      }
    });
  })();
</script>

<script>
  var wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
  function fit() {
    var s = wrap.clientWidth / 1920;
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = Math.round(1080 * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // Карта смещений: src = p · (1 + sign·k·r²), k = 0.05 · сила.
  // sign = +1 — «бочка» (углы тянутся внутрь), sign = −1 — «подушка» (углы растягиваются наружу).
  var W = 960, H = 540, SCALE = 140, mapCanvas = document.createElement('canvas');
  mapCanvas.width = W; mapCanvas.height = H;
  var sign = -1, strength = 0.35;
  function buildMap() {
    var K = 0.05 * strength * sign, ctx = mapCanvas.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
    for (var j = 0; j < H; j++) for (var i = 0; i < W; i++) {
      var x = (i + 0.5) / W * 1920 - 960, y = (j + 0.5) / H * 1080 - 540;
      var r2 = (x * x + y * y) / (960 * 960), o = (j * W + i) * 4;
      d[o] = Math.round((0.5 + x * K * r2 / SCALE) * 255);
      d[o + 1] = Math.round((0.5 + y * K * r2 / SCALE) * 255);
      d[o + 2] = 128; d[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    document.getElementById('fe-map').setAttribute('href', mapCanvas.toDataURL());
  }
  buildMap();

  var lens = document.getElementById('lens'), hud = document.getElementById('hud');
  var lensBtns = document.querySelectorAll('[data-lens]');
  lensBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.getAttribute('data-lens');
      if (m === 'fisheye') { sign = parseFloat(b.getAttribute('data-sign')); buildMap(); }
      lens.classList.toggle('fisheye', m === 'fisheye');
      hud.classList.toggle('tilt', m === 'tilt');
      lensBtns.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  });
  var bSway = document.getElementById('b-sway');
  bSway.addEventListener('click', function () {
    var on = !hud.classList.contains('sway');
    hud.classList.toggle('sway', on);
    bSway.setAttribute('aria-pressed', String(on));
  });
  var range = document.getElementById('strength'), out = document.getElementById('strength-out'), t;
  range.addEventListener('input', function () {
    var v = range.value / 100;
    out.textContent = range.value + '%';
    hud.style.setProperty('--s', v);
    strength = v; clearTimeout(t); t = setTimeout(buildMap, 60);
  });
</script>
