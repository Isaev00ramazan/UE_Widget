# Релиз UMG Studio: Actions → release → Run workflow (версия-тег, например v0.2.0).
# Собирает UMGStudio.exe на Windows, прогоняет тесты и проверку сборки, публикует GitHub Release с архивами.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (станет тегом), например v0.2.2"
        required: true
        default: "v0.2.2"
      prerelease:
        description: "Пометить как пре-релиз"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка
        run: python tools/build_release.py ${{ inputs.version }}

      - name: Проверка собранного exe
        shell: pwsh
        run: |
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "build/dist/UMGStudio/UMGStudio.exe").Path
          $psi.Arguments = "smoke `"$PWD\smoke.json`""
          $psi.WorkingDirectory = $env:TEMP
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "smoke hung" }
          Get-Content smoke.json
          if ($p.ExitCode -ne 0) { throw "smoke failed: $($p.ExitCode)" }

      - name: Проверка окна у скачанного архива
        shell: pwsh
        run: |
          # как после скачивания ZIP из браузера: Windows ставит DLL пометку «из интернета» (Zone.Identifier)
          Get-ChildItem build/dist/UMGStudio -Recurse -Include *.dll,*.exe,*.pyd | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          # запуск без оболочки Windows (CreateProcess): иначе на помеченном exe всплывёт окно «Неизвестный издатель»,
          # которое на CI некому нажать. У пользователя этот шаг — клик «Выполнить»; DLL всё равно остаются помеченными.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "build/dist/UMGStudio/UMGStudio.exe").Path
          $psi.Arguments = "check-window `"$PWD\check-window.json`""
          $psi.WorkingDirectory = $env:TEMP
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "window check hung" }
          Get-Content check-window.json
          if ($p.ExitCode -ne 0) { throw "window check failed: $($p.ExitCode)" }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: UMG Studio ${{ inputs.version }}
          body_path: dist/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/UMGStudio-${{ inputs.version }}-win64.zip
            dist/UMGStudio-Plugin-${{ inputs.version }}-UE5.8.zip
